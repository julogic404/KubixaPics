name: Auditoria de dependencias

# SO corre manualmente: aba Actions > Auditoria de dependencias > Run workflow.
# Envia o grafo de dependencias do projeto para o GitHub (Dependency graph). Com os
# "Dependabot alerts" ativos (Settings > Code security), o GitHub passa a avisar quando
# alguma biblioteca tem uma vulnerabilidade conhecida (CVE).
on:
  workflow_dispatch:

permissions:
  contents: write   # necessario para submeter o grafo de dependencias

jobs:
  submeter-grafo:
    name: Enviar grafo de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar e submeter o grafo (so o que vai para o APK)
        uses: gradle/actions/dependency-submission@v4
        env:
          # Apenas as dependencias de runtime do app (ignora ferramentas de teste/build).
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: '(debug|release)RuntimeClasspath'
