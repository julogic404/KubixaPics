name: Synchronize ZIP Project

# SO corre manualmente: aba Actions > Synchronize ZIP Project > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      # Obter o repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Configurar Git
      # Commits em nome de quem executou o workflow (o bot nao aparece como contribuidor).
      - name: Configure Git
        env:
          ATOR: ${{ github.actor }}
          ATOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name  "$ATOR"
          git config user.email "${ATOR_ID}+${ATOR}@users.noreply.github.com"

      # Extrair e sincronizar ZIP
      - name: Extract and synchronize project
        run: |
          set -e

          echo "Extraindo mind.zip..."

          unzip -o mind.zip -d .

          # Preparar alterações
          git add -A

          # Criar commit apenas se existirem alterações
          if ! git diff --cached --quiet; then
              git commit -m "Synchronize project with mind.zip"
          else
              echo "Nenhuma alteração encontrada."
          fi

          # Sincronizar com GitHub
          git pull --rebase origin main

          # Enviar atualizações
          git push origin main

          echo "Sincronização concluída com sucesso!"
