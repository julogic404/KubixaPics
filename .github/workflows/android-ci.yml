name: Android CI

# Verificacoes e APK debug. SO corre manualmente:
# aba Actions > Android CI > Run workflow.
# O release assinado + publicacao na aba Releases esta em release.yml (tambem manual).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verificacoes rapidas: lint + testes unitarios
  # ---------------------------------------------------------------------------
  checks:
    name: Lint e testes unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissoes do wrapper
        run: chmod +x ./gradlew

      - name: Testes unitarios (todos os modulos)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-lint-testes
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. APK de debug (sempre)
  # ---------------------------------------------------------------------------
  debug:
    name: APK debug
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissoes do wrapper
        run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Localizar APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: KubixaPics-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
