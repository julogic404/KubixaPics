# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Projeto multi-modulo: os modulos de feature referenciam recursos partilhados
# (strings, cores, dimens, estilos) que vivem em :core:ui. Com R nao-transitivo
# essas referencias R.string.* deixariam de compilar, por isso fica desativado.
android.nonTransitiveRClass=false

kotlin.code.style=official
